<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Go2upSkills</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-5" style="max-width: 560px;">
    <h2 class="text-center mb-3">Register</h2>
    <form id="regForm" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" required>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" pattern="[0-9]{9,10}" required>
        <div class="invalid-feedback">Enter 9–10 digits.</div>
      </div>
      <div class="mb-3">
        <label for="course" class="form-label">Select Course</label>
        <select class="form-select" id="course" required>
          <option value="" selected disabled></option>
          <option>Course 1</option><option>Course 2</option><option>Course 3</option>
          <option>Course 4</option><option>Course 5</option><option>Course 6</option>
        </select>
        <div class="invalid-feedback">Please select a course.</div>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div id="result" class="alert alert-success mt-3 d-none">Registration successful!</div>
  </main>
  <script>
    document.getElementById("regForm").addEventListener("submit", function (e) {
      e.preventDefault();
      this.classList.add("was-validated");
      if (this.checkValidity()) {
        document.getElementById("result").classList.remove("d-none");
        this.reset(); this.classList.remove("was-validated");
      }
    });
  </script>
  <footer class="text-center py-3 mt-5">
    <small>&copy; 2024 OnlineCourses. All rights reserved. by รหัสนักศึกษา ชื่อ-นามสกุล</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
